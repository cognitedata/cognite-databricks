# Example CDF configuration for Private Link / PSaaS customers.
# Copy this file, replace placeholders with your values, and do not commit secrets.
# Use a path like /Workspace/Users/<your-user>/config.toml in Databricks.
#
# See docs/private_link_psaas.md for full setup instructions.

[cognite]
project = "your-cdf-project"
tenant_id = "your-azure-ad-tenant-id"
cdf_cluster = "az-xyz-001"
client_id = "your-oauth2-client-id"
client_secret = "your-oauth2-client-secret"
# Cognite-provided Private Link URL (wired into your VPN setup)
# Typical format: p001.plink.<cluster>.cognitedata.com
base_url = "https://p001.plink.az-xyz-001.cognitedata.com"
